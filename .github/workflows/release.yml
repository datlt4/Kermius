name: release

# Push a tag to publish: git tag v1.4.1 && git push github v1.4.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - id: rel
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, name: `Kermius ${tag}`, draft: true, generate_release_notes: true,
            });
            core.setOutput("id", data.id);

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux_x64, os: ubuntu-22.04 }
          - { name: linux_arm64, os: ubuntu-22.04-arm }
          - { name: windows_x64, os: windows-latest }
          - { name: windows_ia32, os: windows-latest, target: i686-pc-windows-msvc }
          - { name: windows_arm64, os: windows-latest, target: aarch64-pc-windows-msvc, args: "--bundles nsis" }
          - { name: macos_arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos_x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri, key: "${{ matrix.name }}" }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (.sig); the publish job builds latest.json from them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # Parallel jobs each rewriting latest.json overwrite one another's platforms.
          uploadUpdaterJson: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ matrix.args }}
      - name: Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Recurse src-tauri/target -Filter kermius.exe | Where-Object { $_.FullName -match 'release' -and $_.FullName -notmatch 'deps' } | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath kermius_${{ matrix.name }}_portable.zip
          gh release upload "${{ github.ref_name }}" kermius_${{ matrix.name }}_portable.zip --clobber

  mobile:
    needs: create-release
    uses: ./.github/workflows/mobile.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [create-release, desktop, mobile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Updater manifest (latest.json) from every platform's signature
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = ${{ needs.create-release.outputs.id }};
            const tag = context.ref.replace("refs/tags/", "");
            // Asset name → updater platform keys (the first key is the platform's default).
            const rules = [
              [/_amd64\.AppImage$/, ["linux-x86_64", "linux-x86_64-appimage"]],
              [/_amd64\.deb$/, ["linux-x86_64-deb"]],
              [/\.x86_64\.rpm$/, ["linux-x86_64-rpm"]],
              [/_aarch64\.AppImage$/, ["linux-aarch64", "linux-aarch64-appimage"]],
              [/_arm64\.deb$/, ["linux-aarch64-deb"]],
              [/\.aarch64\.rpm$/, ["linux-aarch64-rpm"]],
              [/_x64_en-US\.msi$/, ["windows-x86_64", "windows-x86_64-msi"]],
              [/_x64-setup\.exe$/, ["windows-x86_64-nsis"]],
              [/_x86_en-US\.msi$/, ["windows-i686", "windows-i686-msi"]],
              [/_x86-setup\.exe$/, ["windows-i686-nsis"]],
              [/_arm64-setup\.exe$/, ["windows-aarch64", "windows-aarch64-nsis"]],
              [/_x64\.app\.tar\.gz$/, ["darwin-x86_64", "darwin-x86_64-app"]],
              [/_aarch64\.app\.tar\.gz$/, ["darwin-aarch64", "darwin-aarch64-app"]],
            ];
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            const platforms = {};
            for (const a of assets) {
              const rule = rules.find(([re]) => re.test(a.name));
              const sig = assets.find((s) => s.name === `${a.name}.sig`);
              if (!rule || !sig) continue;
              const { data } = await github.rest.repos.getReleaseAsset({ owner, repo, asset_id: sig.id, headers: { accept: "application/octet-stream" } });
              const signature = Buffer.from(data).toString("utf8");
              for (const key of rule[1]) platforms[key] = { signature, url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${a.name}` };
            }
            core.info(`latest.json platforms: ${Object.keys(platforms).join(", ")}`);
            for (const old of assets.filter((a) => a.name === "latest.json")) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            }
            const manifest = { version: tag.replace(/^v/, ""), notes: "", pub_date: new Date().toISOString(), platforms };
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: "latest.json", data: JSON.stringify(manifest, null, 2),
              headers: { "content-type": "application/json" },
            });
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.id }}, draft: false,
            });
