name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Runs first; app builds wait for it.
  sync-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read server version
        id: ver
        run: echo "version=$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hienanh/kermius-sync:latest
            hienanh/kermius-sync:${{ steps.ver.outputs.version }}

