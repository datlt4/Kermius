[package]
name = "kermius-sync"
version = "1.4.1"
edition = "2021"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
